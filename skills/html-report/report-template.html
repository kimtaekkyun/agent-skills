<!doctype html>
<html lang="{{LANGUAGE_TAG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{REPORT_TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
  <style>
    :root {
      --page: #e9ebef;
      --paper: #fff;
      --ink: #2f3035;
      --heading: #1c1d21;
      --secondary: #55575e;
      --muted: #7b7e86;
      --line: #e6e8ec;
      --blue: #0066cc;
      --blue-soft: #f1f6fc;
      --red: #b42318;
      --yellow: #fff0a8;
      --article-width: 1080px;
      --reading-width: 880px;
      --sidebar-width: 220px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-underline-offset: 3px; }
    a:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
    code { padding: 1px 5px; background: #f3f4f6; border-radius: 5px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .92em; }

    .document {
      width: min(var(--article-width), calc(100% - 48px));
      min-height: calc(100vh - 48px);
      margin: 24px auto;
      padding: 48px 72px 36px;
      background: var(--paper);
      border: 1px solid rgba(0, 0, 0, .06);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(29, 29, 31, .03), 0 10px 30px rgba(29, 29, 31, .05);
    }
    .hero { max-width: var(--reading-width); margin: 0 auto 30px; text-align: center; }
    .eyebrow { margin: 0 0 10px; color: var(--blue); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--heading); font-size: clamp(36px, 3.2vw, 46px); font-weight: 700; line-height: 1.2; letter-spacing: -.03em; }
    .lead { margin: 14px 0 0; color: var(--secondary); font-size: 20px; line-height: 1.55; }
    .meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; color: var(--muted); font-size: 13px; }
    .meta span { padding: 5px 12px; background: #f3f4f6; border-radius: 999px; }

    .sidebar {
      display: none;
      position: fixed;
      z-index: 2;
      top: 112px;
      left: max(24px, calc(50% - var(--article-width) / 2 - var(--sidebar-width) - 28px));
      width: var(--sidebar-width);
      padding: 18px 16px;
      background: rgba(255, 255, 255, .97);
      border: 1px solid rgba(0, 0, 0, .06);
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(29, 29, 31, .04);
    }
    .sidebar h2, .compact-toc summary { margin: 0 0 10px; color: var(--heading); font-size: 15px; font-weight: 700; }
    .sidebar ol, .compact-toc ol { margin: 0; padding-left: 20px; }
    .sidebar li, .compact-toc li { padding: 4px 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .sidebar li::marker, .compact-toc li::marker { color: #9ca0a8; font-weight: 600; }
    .sidebar a, .compact-toc a { display: inline-block; padding: 2px 6px; color: var(--secondary); text-decoration: none; border-radius: 6px; transition: background-color .16s ease, color .16s ease; }
    .sidebar a:hover, .compact-toc a:hover { color: var(--blue); background: #f4f8fc; }
    .sidebar a.is-current, .compact-toc a.is-current { color: var(--blue); background: var(--blue-soft); font-weight: 650; }
    .sidebar ol ol, .compact-toc ol ol { margin: 3px 0 2px 4px; padding: 2px 0 2px 12px; list-style: none; border-left: 1px solid #e3e6eb; }
    .sidebar ol ol li, .compact-toc ol ol li { padding: 2px 0; font-size: 13px; }
    .compact-toc { max-width: var(--reading-width); margin: 0 auto 24px; padding: 14px 20px; background: #f6f7f9; border: 1px solid rgba(29, 29, 31, .06); border-radius: 18px; }
    .compact-toc summary { cursor: pointer; }

    .content { max-width: var(--reading-width); margin: 0 auto; }
    .section { padding: 28px 0 30px; border-top: 1px solid var(--line); scroll-margin-top: 24px; }
    .section:first-child { padding-top: 0; border-top: 0; }
    .section + .section { padding-top: 28px; }
    h2 { margin: 0 0 14px; color: var(--heading); font-size: 28px; font-weight: 700; line-height: 1.32; letter-spacing: -.03em; }
    h3 { margin: 26px 0 8px; color: var(--heading); font-size: 20px; font-weight: 650; line-height: 1.4; scroll-margin-top: 24px; }
    p, ul, ol { margin: 0 0 16px; }
    li + li { margin-top: 6px; }
    strong { color: var(--heading); font-weight: 700; }

    .summary, .callout { margin: 20px 0; padding: 18px 22px; background: var(--blue-soft); border: 1px solid #e2ebf6; border-radius: 18px; box-shadow: inset 3px 0 0 var(--blue); }
    .callout.warning { background: #fff9e9; border-color: #f0e6c6; box-shadow: inset 3px 0 0 #c28a00; }
    .callout.danger { background: #fff5f4; border-color: #f2dfdc; box-shadow: inset 3px 0 0 var(--red); }
    .summary > :last-child, .callout > :last-child { margin-bottom: 0; }
    .text-danger { color: var(--red); font-weight: 700; }
    mark { padding: .08em .2em; background: var(--yellow); color: var(--heading); border-radius: 3px; box-decoration-break: clone; }

    .metric-grid { max-width: var(--reading-width); display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin: 20px 0; }
    .metric-card { min-width: 0; padding: 16px 18px; background: #fff; border: 1px solid rgba(0, 0, 0, .06); border-radius: 18px; }
    .metric-label { display: block; color: var(--muted); font-size: 14px; }
    .metric-value { display: block; margin-top: 3px; color: var(--heading); font-size: 27px; font-weight: 700; letter-spacing: -.03em; line-height: 1.25; }

    .table-wrap { width: 100%; margin: 20px 0; background: var(--paper); border: 1px solid rgba(0, 0, 0, .06); border-radius: 18px; overflow-x: auto; overscroll-behavior-x: contain; }
    table { width: 100%; border-collapse: collapse; font-size: 16px; }
    caption { padding: 14px 18px 8px; color: var(--muted); font-size: 14px; font-weight: 500; text-align: left; caption-side: top; }
    th, td { padding: 13px 18px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    thead th { background: #f6f7f9; border-top: 0; border-bottom: 1px solid #dfe1e6; color: var(--secondary); font-size: 14px; font-weight: 650; }

    pre { max-width: var(--reading-width); margin: 20px 0; padding: 16px 18px; overflow-x: auto; background: #1c1d21; border-radius: 18px; color: #f5f5f7; font-size: 14px; line-height: 1.6; }
    pre code { padding: 0; background: transparent; color: inherit; }
    figure { max-width: var(--reading-width); margin: 24px 0; }
    figure img, figure svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    figcaption { margin-top: 8px; color: var(--muted); font-size: 14px; text-align: left; }

    .footer { max-width: var(--reading-width); margin: 28px auto 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

    @media (min-width: 1640px) { .sidebar { display: block; } .compact-toc { display: none; } }
    @media (max-width: 700px) {
      body { font-size: 17px; }
      .document { width: 100%; min-height: 100vh; margin: 0; padding: 30px 20px 26px; border: 0; border-radius: 0; box-shadow: none; }
      .hero { margin-bottom: 24px; }
      .lead { font-size: 18px; }
      .section, .section + .section { padding-top: 26px; padding-bottom: 26px; }
      .section:first-child { padding-top: 0; }
      h2 { font-size: 25px; }
      .metric-grid { gap: 12px; }
      .metric-card { padding: 14px 15px; }
      table { min-width: 600px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
    @media print {
      body { background: #fff; font-size: 12pt; }
      .document { width: 100%; min-height: 0; margin: 0; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
      .sidebar { display: none !important; }
      .compact-toc { display: block !important; }
      .table-wrap { overflow: visible; border: 0; border-radius: 0; }
      table { min-width: 0 !important; }
      .metric-card { break-inside: avoid; }
      .section { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="목차">
    <h2>목차</h2>
    <nav><ol>{{TOC_ITEMS}}</ol></nav>
  </aside>
  <main class="document">
    <header class="hero">
      <p class="eyebrow">{{REPORT_LABEL}}</p>
      <h1>{{REPORT_TITLE}}</h1>
      <p class="lead">{{REPORT_LEAD}}</p>
      <div class="meta">{{REPORT_METADATA}}</div>
    </header>
    <nav class="compact-toc" aria-label="목차">
      <details open><summary>목차</summary><ol>{{TOC_ITEMS}}</ol></details>
    </nav>
    <article class="content">{{REPORT_SECTIONS}}</article>
    <footer class="footer">{{REPORT_FOOTER}}</footer>
  </main>
  <script>
    const tocLinks = [...document.querySelectorAll('.sidebar a, .compact-toc a')];
    const targets = [...document.querySelectorAll('.content [id]')];
    const setCurrent = (id) => {
      tocLinks.forEach((link) => {
        const current = link.hash === `#${id}`;
        link.classList.toggle('is-current', current);
        if (current) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
    };
    if (targets[0]) setCurrent(targets[0].id);
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible[0]) setCurrent(visible[0].target.id);
      }, { rootMargin: '-18% 0px -72% 0px' });
      targets.forEach((target) => observer.observe(target));
    }
  </script>
</body>
</html>
